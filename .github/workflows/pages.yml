name: Test and publish

# Validates the metadata and runs the tests on every pull request; on main,
# also builds site/data/ and publishes site/ to GitHub Pages.
#
# Requires Settings -> Pages -> Source -> GitHub Actions.
#
# site/data/ is generated here rather than committed, so the published site is
# always built from the metadata of the commit being published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: r-lib/actions/setup-r@v2
      - name: Install haven
        run: Rscript -e 'install.packages("haven", repos = "https://cloud.r-project.org")'
      - name: Install Python dependencies
        run: uv sync --extra test
      - name: Build site data
        run: uv run python build.py
      - name: Test
        run: uv run python -m unittest discover -s tests -v

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Never cancel midway: a half-finished deploy leaves the site inconsistent.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build site data
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
